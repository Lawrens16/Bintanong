# Render Blueprint for the hosted-LLM agent API (Phase 13 fork). Free plan, no card.
# Secrets use `sync: false`: Render asks for them once when the Blueprint is created; they are never in Git.
# Deploys are started by hand (autoDeployTrigger: off), so each deploy is confirmed by the owner.
services:
  - type: web
    name: bintanong-agent-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./docker/agent-api.Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeployTrigger: "off"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY  # the public anon/publishable key; a service-role key is refused at startup
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: BINTANONG_LLM_PROVIDER
        value: deepseek
      - key: BINTANONG_ALLOWED_ORIGINS  # the Vercel site origin, e.g. https://<project>.vercel.app
        sync: false
      # No BINTANONG_ALLOW_GUESTS: chatting needs a verified @psu.palawan.edu.ph Google sign-in (owner, 16 Nov 2026).
      - key: BINTANONG_DAILY_QUESTIONS_PER_PERSON  # rolling 24 hours, counted in memory
        value: "20"
      - key: BINTANONG_DAILY_QUESTIONS_TOTAL  # everyone together
        value: "150"
      - key: BINTANONG_RELEASE_ID
        value: p12-research-faqsplit-20261030
      - key: BINTANONG_RESEARCH_AUTHORIZATION
        value: research-owner-20261029
